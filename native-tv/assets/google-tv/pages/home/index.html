<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Native Tv Home</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/google-tv/shared/common.css" data-sections="tokens fonts reset base button list card chip controls overlay drawer progress carousel boot field keyboard">
<link rel="stylesheet" href="/assets/google-tv/pages/home/home.css" id="look">
</head>
<body>
<div id="stage">
  <div id="wall"><div class="layer"></div><div class="layer"></div></div>
  <div id="scrim"></div>

  <nav id="nav"><div id="avatar" data-avatar="1" role="button"></div><div class="group" id="tabs"></div><div class="tab gear" id="gear" data-gear="1" aria-label="Quick settings"></div><div class="tab search-tool" id="searchTool" data-search="1" role="button"></div></nav>
  <div id="clock"><b id="clockTime">&mdash;</b><span id="date"></span></div>

  <section id="feature" class="gt-carousel" data-hero="1">
    <div class="bloom" id="bloomA"></div>
    <div class="back" id="backA"></div><div class="back" id="backB"></div>
    <div id="heroicon" class="gt-carousel-icon"></div>
    <div id="plate" class="gt-carousel-plate none"></div>
    <div id="hero" class="gt-carousel-content"></div>
    <div id="dots" class="gt-carousel-dots" data-dots="1"></div>
  </section>
  <main id="rows"></main>

  <div id="contentView">
    <section id="titleView">
      <div class="gt-carousel">
        <div class="back on" id="dtBack"></div>
        <div class="gt-carousel-content">
          <div class="eyebrow" id="dtType"></div><h1 class="title" id="dtTitle"></h1>
          <div class="line" id="dtFacts"></div><p class="desc" id="dtOverview"></p>
          <p id="dtCast"></p>
        </div>
      </div>
      <button type="button" class="gt-btn content-close" id="dtClose"></button>
      <div id="dtActions"></div><div id="dtStatus" role="status"></div>
      <section id="dtMore"><h2 id="dtMoreTitle"></h2><div class="content-strip"><div id="dtCards"></div></div></section>
    </section>
    <section id="editorView">
      <button type="button" class="gt-btn content-close" id="editClose"></button>
      <div class="gt-field active" id="editField"><label class="gt-field-label" for="editQuery" id="editLabel"></label>
        <input type="text" readonly class="gt-field-box" id="editQuery" autocomplete="off">
        <span class="gt-field-support" id="editStatus" role="status"></span>
      </div>
      <div class="gt-keyboard" id="editKeyboard"></div>
      <div id="editFooter"><button type="button" class="gt-chip" id="editClear"></button><button type="button" class="gt-chip" id="editDone"></button></div>
      <div id="editCount"></div><div id="editResults"></div>
    </section>
    <div class="gt-scrim" id="overviewView"><div class="gt-dialog"><div class="gt-dialog-body" id="overviewText"></div><div class="gt-dialog-actions"><button type="button" class="gt-btn focus" id="overviewClose"></button></div></div></div>
  </div>

  <!-- Quick settings: the kit's modal drawer on its scrim, filled by quick.js. -->
  <div class="gt-scrim" id="qs">
    <div class="gt-drawer" id="qsDrawer" data-drawer="1">
      <div class="gt-list-header" id="qsTitle"></div>
      <div class="gt-drawer-view" id="qsView"><div class="gt-drawer-list" id="qsList"></div></div>
    </div>
  </div>

  <div id="toast"></div>

  <section id="recents">
    <div class="head">
      <h2>Recent apps</h2>
      <span id="closeAll">Close all</span>
    </div>
    <div class="wrap"><div class="track" id="recentsTrack"></div></div>
  </section>

  <div id="fault">
    <h1>Native Tv is not answering</h1>
    <p>Native Tv Home comes back when it answers. Should it stay silent, LG's Home comes back in a few minutes.</p>
  </div>

  <div id="boot" class="gt-boot">
    <div class="sw s1"></div><div class="sw s2"></div><div class="sw s3"></div><div class="sw s4"></div>
    <div class="mid">
      <!-- The Native Tv mark, as in favicon.svg: an n whose arch is a screen corner. -->
      <svg viewBox="140 128 232 266"><path d="M168 362 V154 M168 254 Q168 154 258 154 Q344 154 344 254 V362"/><circle cx="256" cy="362" r="24" fill="currentColor"/></svg>
      <div class="gt-progress busy"><div class="gt-progress-bar"></div></div>
    </div>
  </div>
</div>

<script src="/assets/google-tv/shared/common.js"></script>
<script src="/assets/google-tv/shared/keyboard.js"></script>
<script src="/assets/google-tv/pages/home/quick.js"></script>
<script src="/assets/google-tv/pages/home/content.js"></script>
<script src="/assets/google-tv/pages/home/home.js"></script>
</body>
</html>
