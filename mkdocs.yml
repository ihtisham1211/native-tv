site_name: Native Tv
site_description: A dashboard, privacy controls and Home Assistant bridge for rooted LG webOS TVs.
site_url: https://ihtisham1211.github.io/native-tv/
repo_url: https://github.com/ihtisham1211/native-tv
repo_name: native-tv
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: logo/nativetv.svg
  favicon: logo/nativetv-512.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light theme }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark theme }
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting started:
      - Installing: install.md
      - Tested TVs: tested-tvs.md
      - Updating and uninstalling: managing.md
  - The dashboard:
      - dashboard/index.md
      - Control: dashboard/control.md
      - Metrics: dashboard/metrics.md
      - Apps: dashboard/apps.md
      - Home: dashboard/home.md
      - Privacy: dashboard/privacy.md
      - OLED Care: dashboard/oled-care.md
      - Game: dashboard/game.md
      - Screen savers: dashboard/screen-savers.md
      - Advanced Controls: dashboard/advanced.md
      - Service menu: dashboard/service-menu.md
      - Server: dashboard/server.md
      - Tools: dashboard/tools.md
  - Native Tv apps:
      - The TV app: apps/tv-app.md
      - Android wrapper: apps/android.md
  - Smart Home & Lighting:
      - Home Assistant:
          - Overview: HOME-ASSISTANT.md
          - Entities: HOME-ASSISTANT-ENTITIES.md
          - Remote button events: HOME-ASSISTANT-REMOTE-BUTTONS.md
      - Ambient light (PicCap): piccap.md
  - Advanced & Administration:
      - Security: SECURITY.md
      - What it changes on the TV: TV-CHANGES.md
      - What LG's ACR does: ACR.md
      - Network time (NTP): ntp.md
      - Prometheus metrics: PROMETHEUS.md
      - Log forwarding (syslog): syslog.md
      - Experimental features: experimental.md
  - Development:
      - Contributing: CONTRIBUTING.md
      - Internals: IMPLEMENTATION.md
      - TV hardware specifications:
          - development/tv-specs/index.md
          - LG B8 (OLED65B8SLC): development/tv-specs/b8.md
          - LG C9 (OLED65C97LA): development/tv-specs/c9.md
          - LG CX (OLED48CXPUB): development/tv-specs/cx.md
          - LG C2 (OLED42C24LA): development/tv-specs/c2.md
          - LG C5 (OLED48C5PUA): development/tv-specs/c5.md
          - LG UA73 (55UA73006LA): development/tv-specs/ua73.md
          - LG NU80 (43NU800BPSC): development/tv-specs/nu80.md
      - Testing and CI: development/testing.md
      - TV research: development/TV-RESEARCH.md
      - Strings: STRINGS.md

# Kept until the Homebrew Channel listing is live.
not_in_nav: |
  /install-homebrew-channel.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - github-callouts
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  anchors: warn
  unrecognized_links: warn
