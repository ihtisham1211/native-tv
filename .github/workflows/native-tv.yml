name: Native TV

on:
  push:
    branches: [main]
    paths: ['native-tv/**', '.github/workflows/native-tv.yml']
  pull_request:
    paths: ['native-tv/**', '.github/workflows/native-tv.yml']
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libjson-c-dev libcurl4-openssl-dev zlib1g-dev libgles2-mesa-dev
      - name: Build and test with sanitizers
        run: python3 native-tv/build.py --sanitize --out native-tv/build-sanitize --test
      - name: Route manifest and test matrix
        run: node native-tv/tests/contract/check-route-manifest.js && node native-tv/tests/contract/check-test-matrix.js
